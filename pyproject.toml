[project]
name = "zhuoqu-poster"
version = "0.1.0"
description = "zhuoqu poster skill: research-backed hand-drawn poster generation with a dual-role Chinese typography engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pillow>=10.0", "fonttools>=4.47", "opencv-python-headless>=4.9", "scipy>=1.11",
  "pydantic>=2.5", "pyyaml>=6.0", "imagehash>=4.3", "requests>=2.31", "beautifulsoup4>=4.12",
  "rapidocr_onnxruntime>=1.3",
]

[project.optional-dependencies]
clip = ["torch>=2.2", "open_clip_torch>=2.24"]
dev = ["pytest>=8"]

[project.scripts]
zhuoqu = "zhuoqu.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zhuoqu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end poster rendering"]
